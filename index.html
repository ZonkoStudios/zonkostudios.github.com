<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonko | Games & Anime</title>
    <style>
        /* --- Design System & Variables --- */
        :root {
            --bg-dark: #0a0f0d;
            --bg-card: #121a16;
            --primary-green: #39ff14; /* Neon Green */
            --accent-green: #00ff87;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --danger-red: #ff3333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- Header & Navigation --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: rgba(18, 26, 22, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--primary-green);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mascot-head {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #4a5568, #2d3748);
            border: 3px solid var(--primary-green);
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mascot-head::before {
            content: '';
            position: absolute;
            bottom: -2px;
            width: 100%;
            height: 50%;
            background-color: var(--primary-green);
            border-radius: 0 0 50% 50%;
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo-text span {
            color: var(--primary-green);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            color: var(--text-muted);
            text
