<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zonko | Games & Anime</title>

<style>
:root {
    --bg-dark: #0a0f0d;
    --bg-card: #121a16;
    --primary-green: #39ff14;
    --accent-green: #00ff87;
    --text-main: #ffffff;
    --text-muted: #a0aec0;
    --danger-red: #ff3333;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    overflow-x: hidden;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 5%;
    background-color: rgba(18, 26, 22, 0.8);
    backdrop-filter: blur(10px);
    border-bottom: 2px solid var(--primary-green);
    position: sticky;
    top: 0;
    z-index: 100;
}

.hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 40px 5%;
    min-height: 30vh;
    background: radial-gradient(circle at 80% 20%, rgba(57, 255, 20, 0.08) 0%, transparent 50%);
}

.view-theater {
    max-width: 900px;
    margin: 20px auto 50px auto;
    padding: 0 20px;
    display: none;
}

.theater-screen-wrapper {
    background-color: #050806;
    border: 3px solid var(--primary-green);
    border-radius: 12px;
    position: relative;
    width: 100%;
    height: 480px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#active-game-window {
    width: 100%;
    height: 100%;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
    margin-bottom: 60px;
}

.card {
    background-color: var(--bg-card);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #1f2e26;
    cursor: pointer;
    transition: transform 0.3s ease, border-color 0.3s ease;
    display: flex;
    flex-direction: column;
}

.card:hover {
    transform: translateY(-5px);
    border-color: var(--primary-green);
}

.card-thumb {
    width: 100%;
    height: 180px;
    background-color: #050806;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 3rem;
    position: relative;
}

.card-info {
    padding: 20px;
}

.card-tag {
    color: var(--primary-green);
}

footer {
    background-color: #060a08;
    padding: 30px;
    text-align: center;
    border-top: 1px solid #1f2e26;
    color: var(--text-muted);
}
</style>
</head>

<body>

<header>
    <div class="logo-area">
        <div class="mascot-head">🦝</div>
        <div class="logo-text">Zonko<span>.</span></div>
    </div>
</header>

<section class="hero">
    <h1>Zonko Game Hub</h1>
</section>

<section class="view-theater" id="game-theater-section">
    <div class="theater-screen-wrapper">
        <div id="active-game-window"></div>
    </div>

    <h2 id="meta-game-title"></h2>
    <p id="meta-game-desc"></p>
</section>

<div class="grid">

    <div class="card" onclick="loadGame('quest')">
        <div class="card-thumb">🦝</div>
        <h3>Cyber Raccoon Quest</h3>
    </div>

    <div class="card" onclick="loadGame('wbwwb')">
        <div class="card-thumb">👁️</div>
        <h3>We Become What We Behold</h3>
    </div>

</div>

<script>

function loadGame(gameKey) {

    const theater = document.getElementById('game-theater-section');
    const windowFrame = document.getElementById('active-game-window');

    theater.style.display = "block";

    if (gameKey === "quest") {
        document.getElementById("meta-game-title").innerText = "Cyber Raccoon Quest";
        document.getElementById("meta-game-desc").innerText = "Collect neon data cubes.";
        windowFrame.innerHTML = "<canvas width='600' height='400'></canvas>";
    }

    else if (gameKey === "wbwwb") {
        document.getElementById("meta-game-title").innerText = "We Become What We Behold";
        document.getElementById("meta-game-desc").innerText = "A game about media and society.";
        windowFrame.innerHTML = `
            <iframe
                src="https://ncase.itch.io/wbwwb"
                style="width:100%; height:100%; border:0;"
                allowfullscreen>
            </iframe>
        `;
    }

    theater.scrollIntoView({ behavior: "smooth" });
}

</script>

</body>
</html>
