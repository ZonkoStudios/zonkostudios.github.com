<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zonko | Games & Anime</title>

<style>
:root {
    --bg-dark: #060907;
    --bg-card: #0d1410;
    --primary-green: #39ff14;
    --accent-green: #00ff87;
    --text-main: #ffffff;
    --text-muted: #8fa095;
    --card-border: #1a2920;
    --glow: rgba(57, 255, 20, 0.2);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    overflow-x: hidden;
    padding-bottom: 60px;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 5%;
    background-color: rgba(13, 20, 16, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
}

.mascot-head {
    font-size: 2rem;
    transition: transform 0.3s ease;
}

.logo-area:hover .mascot-head {
    transform: rotate(-10deg) scale(1.1);
}

.logo-text {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text-main);
}

.logo-text span {
    color: var(--primary-green);
    text-shadow: 0 0 10px var(--primary-green);
}

/* HERO SECTION */
.hero {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 60px 5% 40px 5%;
    background: radial-gradient(circle at 10% 50%, rgba(57, 255, 20, 0.06) 0%, transparent 45%);
}

.hero h1 {
    font-size: 2.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, #fff 30%, var(--accent-green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -1px;
}

/* THEATER / STREAM VIEW */
.view-theater {
    max-width: 960px;
    margin: 20px auto 60px auto;
    padding: 0 20px;
    display: none;
    animation: fadeIn 0.4s ease-out forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.theater-screen-wrapper {
    background-color: #000000;
    border: 2px solid var(--primary-green);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 25px var(--glow);
    position: relative;
    width: 100%;
    height: 520px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    margin-bottom: 25px;
}

#active-game-window {
    width: 100%;
    height: 100%;
}

#meta-game-title {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: #fff;
}

#meta-game-desc {
    font-size: 1.1rem;
    color: var(--text-muted);
    line-height: 1.5;
}

/* GRID & CARDS */
.grid-wrapper {
    padding: 0 5%;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
    max-width: 1400px;
    margin: 0 auto;
}

.card {
    background-color: var(--bg-card);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--card-border);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
}

.card:hover {
    transform: translateY(-6px);
    border-color: var(--primary-green);
    box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 15px rgba(57, 255, 20, 0.15);
}

.card-thumb {
    width: 100%;
    height: 160px;
    background: linear-gradient(180deg, #050806 0%, #0c120e 100%);
    border-bottom: 1px solid var(--card-border);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 3.5rem;
    transition: background 0.3s ease;
}

.card:hover .card-thumb {
    background: linear-gradient(180deg, #080d0a 0%, #111a14 100%);
}

.card-info {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.card-tag {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--primary-green);
}

.card-info h3 {
    font-size: 1.3rem;
    font-weight: 600;
    color: #ffffff;
}

</style>
</head>

<body>

<header>
    <div class="logo-area" onclick="window.location.reload();">
        <div class="mascot-head">🦝</div>
        <div class="logo-text">Zonko<span>.</span></div>
    </div>
</header>

<section class="hero">
    <h1>Zonko Game Hub</h1>
</section>

<section class="view-theater" id="game-theater-section">
    <div class="theater-screen-wrapper">
        <div id="active-game-window"></div>
    </div>
    <h2 id="meta-game-title"></h2>
    <p id="meta-game-desc"></p>
</section>

<div class="grid-wrapper">
    <div class="grid">

        <div class="card" onclick="loadGame('quest')">
            <div class="card-thumb">🦝</div>
            <div class="card-info">
                <span class="card-tag">Adventure</span>
                <h3>Cyber Raccoon Quest</h3>
            </div>
        </div>

        <div class="card" onclick="loadGame('wbwwb')">
            <div class="card-thumb">👁️</div>
            <div class="card-info">
                <span class="card-tag">Interactive</span>
                <h3>We Become What We Behold</h3>
            </div>
        </div>

    </div>
</div>

<script>

function loadGame(gameKey) {
    const theater = document.getElementById('game-theater-section');
    const windowFrame = document.getElementById('active-game-window');

    theater.style.display = "block";

    if (gameKey === "quest") {
        document.getElementById("meta-game-title").innerText = "Cyber Raccoon Quest";
        document.getElementById("meta-game-desc").innerText = "Collect neon data cubes.";
        windowFrame.innerHTML = "<canvas width='600' height='400' style='background:#111; max-width:100%; height:auto;'></canvas>";
    } 
    else if (gameKey === "wbwwb") {
        document.getElementById("meta-game-title").innerText = "We Become What We Behold";
        document.getElementById("meta-game-desc").innerText = "A game about media and society.";
        windowFrame.innerHTML = `
            <iframe
                src="https://ncase.itch.io/wbwwb"
                style="width:100%; height:100%; border:0;"
                allowfullscreen>
            </iframe>
        `;
    }

    theater.scrollIntoView({ behavior: "smooth", block: "start" });
}

</script>

</body>
</html>
