<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonko | Games & Anime</title>
    <style>
        /* --- Design System & Variables --- */
        :root {
            --bg-dark: #0a0f0d;
            --bg-card: #121a16;
            --primary-green: #39ff14;
            --accent-green: #00ff87;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --danger-red: #ff3333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: rgba(18, 26, 22, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--primary-green);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .hero {
            padding: 40px 5%;
        }

        .view-theater {
            max-width: 900px;
            margin: 20px auto 50px auto;
            padding: 0 20px;
            display: none;
        }

        .theater-screen-wrapper {
            background-color: #050806;
            border: 3px solid var(--primary-green);
            border-radius: 12px;
            position: relative;
            width: 100%;
            height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #active-game-window {
            width: 100%;
            height: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px 5%;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            border: 1px solid #1f2e26;
        }

        .card:hover {
            border-color: var(--primary-green);
        }

        .card-thumb {
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
        }

        .card-tag {
            color: var(--primary-green);
        }

        .fullscreen-btn {
            background: #1a2620;
            border: 1px solid var(--primary-green);
            color: var(--primary-green);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo-text">Zonko<span>.</span></div>
</header>

<section class="hero">
    <h1>Game Hub</h1>
</section>

<!-- THEATER -->
<section class="view-theater" id="game-theater-section">

    <div class="theater-screen-wrapper">
        <div id="active-game-window"></div>
    </div>

    <h2 id="meta-game-title"></h2>
    <p id="meta-game-desc"></p>

</section>

<!-- GAMES -->
<div class="grid">

    <div class="card" onclick="loadGame('quest')">
        <div class="card-thumb">🦝</div>
        <h3>Cyber Raccoon Quest</h3>
    </div>

    <div class="card" onclick="loadGame('wbwwb')">
        <div class="card-thumb">👁️</div>
        <h3>We Become What We Behold</h3>
    </div>

</div>

<script>

let windowFrame = document.getElementById('active-game-window');

function loadGame(gameKey) {

    const theater = document.getElementById('game-theater-section');
    const windowFrame = document.getElementById('active-game-window');

    theater.style.display = "block";

    if (gameKey === "quest") {

        document.getElementById("meta-game-title").innerText = "Cyber Raccoon Quest";
        document.getElementById("meta-game-desc").innerText = "Collect neon data cubes.";

        windowFrame.innerHTML = "<canvas width='600' height='400'></canvas>";
    }

    else if (gameKey === "wbwwb") {

        document.getElementById("meta-game-title").innerText = "We Become What We Behold";
        document.getElementById("meta-game-desc").innerText = "A game about media and society.";

        // FIXED VERSION (important change)
        windowFrame.innerHTML = `
            <iframe
                src="https://ncase.itch.io/wbwwb"
                style="width:100%; height:100%; border:0;"
                allowfullscreen>
            </iframe>
        `;
    }

    theater.scrollIntoView({ behavior: "smooth" });
}

</script>

</body>
</html>
